<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ec4899;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="url(#logoGradient)" opacity="0.1"/>
  
  <!-- Main geometric shape - stylized P -->
  <g transform="translate(100, 100)">
    <!-- Vertical bar -->
    <rect x="-15" y="-50" width="20" height="100" fill="url(#logoGradient)" rx="10"/>
    
    <!-- Top curve -->
    <path d="M 5 -50 Q 40 -50 40 -20 Q 40 0 5 0" fill="none" stroke="url(#logoGradient)" stroke-width="20" stroke-linecap="round"/>
    
    <!-- Accent elements -->
    <circle cx="35" cy="-35" r="8" fill="url(#accentGradient)"/>
    <circle cx="25" cy="35" r="6" fill="url(#accentGradient)" opacity="0.7"/>
  </g>
  
  <!-- Text -->
  <text x="100" y="165" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="url(#logoGradient)">PiyRox</text>
</svg>
