<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="faviconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="200" height="200" fill="#ffffff"/>
  
  <!-- Main shape -->
  <g transform="translate(100, 100)">
    <!-- Vertical bar -->
    <rect x="-12" y="-45" width="16" height="90" fill="url(#faviconGradient)" rx="8"/>
    
    <!-- Top curve -->
    <path d="M 4 -45 Q 35 -45 35 -18 Q 35 0 4 0" fill="none" stroke="url(#faviconGradient)" stroke-width="16" stroke-linecap="round"/>
    
    <!-- Accent dot -->
    <circle cx="30" cy="-30" r="6" fill="url(#faviconGradient)"/>
  </g>
</svg>
